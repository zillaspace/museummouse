<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Every museum on Earth</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.min.css">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #F1EFE9;
    --ink-soft: #B9B6AD;
    --panel: rgba(22, 22, 20, 0.86);
    --whale: #7FB0DC;
    --pin: #F5E6C8;
    --rule: rgba(255,255,255,0.14);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Archivo", "Helvetica Neue", Helvetica, Arial, sans-serif;
    color: var(--ink);
    background: #0d1117;
    overflow: hidden;
  }
  #map { position: absolute; inset: 0; background: #0d1117; }

  .headline {
    position: absolute; top: 1.25rem; left: 1.25rem; z-index: 800;
    max-width: 26rem;
    background: var(--panel);
    backdrop-filter: blur(6px);
    padding: 1.25rem 1.5rem 1.1rem;
    border: 1px solid var(--rule);
  }
  .headline h1 {
    margin: 0;
    font-size: clamp(2rem, 5vw, 3.2rem);
    font-weight: 900;
    line-height: 0.95;
    letter-spacing: -0.03em;
  }
  .headline h1 small {
    display: block;
    font-size: 0.42em;
    font-weight: 500;
    letter-spacing: 0;
    line-height: 1.2;
    margin-top: 0.4rem;
    color: var(--ink);
  }
  .headline p {
    margin: 0.85rem 0 0;
    font-size: 0.9rem;
    color: var(--ink-soft);
    line-height: 1.4;
  }
  .headline p b { color: var(--pin); font-weight: 700; }

  .tools {
    position: absolute; top: 1.25rem; right: 1.25rem; z-index: 800;
    width: 19rem; max-width: calc(100vw - 2.5rem);
    background: var(--panel);
    backdrop-filter: blur(6px);
    border: 1px solid var(--rule);
    padding: 1rem 1.1rem;
    max-height: calc(100vh - 2.5rem);
    overflow: auto;
  }
  .tools input[type="search"] {
    width: 100%;
    font: inherit;
    font-size: 0.95rem;
    padding: 0.55rem 0.7rem;
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--rule);
    color: var(--ink);
    outline: none;
  }
  .tools input[type="search"]:focus { border-color: var(--whale); }
  .row { display: flex; gap: 0.5rem; margin-top: 0.6rem; flex-wrap: wrap; }
  button {
    font: inherit;
    font-size: 0.85rem;
    font-weight: 500;
    padding: 0.45rem 0.7rem;
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--rule);
    color: var(--ink);
    cursor: pointer;
  }
  button:hover, button:focus-visible { border-color: var(--whale); outline: none; }
  button.primary { background: var(--whale); color: #101418; border-color: var(--whale); font-weight: 700; }
  button.on { background: var(--pin); color: #101418; border-color: var(--pin); }
  .results { margin-top: 0.6rem; font-size: 0.85rem; }
  .results div {
    padding: 0.4rem 0.2rem;
    border-top: 1px solid var(--rule);
    cursor: pointer;
    line-height: 1.3;
  }
  .results div:hover { color: var(--whale); }
  .results span { color: var(--ink-soft); }
  .status { margin-top: 0.7rem; font-size: 0.8rem; color: var(--ink-soft); line-height: 1.4; }
  .bar { height: 3px; background: var(--rule); margin-top: 0.4rem; }
  .bar i { display: block; height: 100%; width: 0; background: var(--whale); transition: width 0.3s; }
  .starred { margin-top: 0.8rem; border-top: 1px solid var(--rule); padding-top: 0.6rem; font-size: 0.85rem; }
  .starred h2 { font-size: 0.85rem; margin: 0 0 0.3rem; font-weight: 700; color: var(--pin); }
  .starred div { padding: 0.25rem 0; cursor: pointer; }
  .starred div:hover { color: var(--whale); }

  .leaflet-popup-content-wrapper {
    background: #16161A; color: var(--ink);
    border-radius: 0; font-family: inherit;
    box-shadow: 0 6px 24px rgba(0,0,0,0.5);
  }
  .leaflet-popup-tip { background: #16161A; }
  .leaflet-popup-content { margin: 0.9rem 1rem; font-size: 0.9rem; line-height: 1.4; }
  .leaflet-popup-content b { font-size: 1rem; }
  .leaflet-popup-content a { color: var(--whale); }
  .leaflet-popup-content button { margin-top: 0.5rem; }
  .leaflet-control-attribution { background: rgba(0,0,0,0.55); color: #aaa; font-size: 10px; }
  .leaflet-control-attribution a { color: #ccc; }
  .leaflet-bar a { background: #16161A; color: var(--ink); border-bottom-color: var(--rule); }
  .leaflet-bar a:hover { background: #24242A; }

  .marker-cluster { background: rgba(127,176,220,0.35); }
  .marker-cluster div {
    background: rgba(127,176,220,0.85);
    color: #101418; font-weight: 700; font-family: inherit;
  }
  @media (max-width: 720px) {
    .headline { max-width: calc(100vw - 2.5rem); }
    .tools { top: auto; bottom: 1.25rem; max-height: 45vh; }
  }
</style>
</head>
<body>
<div id="map" role="application" aria-label="Map of museums"></div>

<div class="headline">
  <h1>104,000 museums.<small>Almost none of them have a film.</small></h1>
  <p><b id="count">0</b> <span id="countLabel">on the map. Load data to begin.</span></p>
</div>

<div class="tools">
  <input id="q" type="search" placeholder="Search by museum or country" aria-label="Search museums">
  <div class="row">
    <button id="load" class="primary">Load from Wikidata</button>
    <button id="sat" class="on">Satellite</button>
    <button id="street">Streets</button>
  </div>
  <div class="status" id="status"></div>
  <div class="bar"><i id="barFill"></i></div>
  <div class="results" id="results"></div>
  <div class="starred" id="starredBox" hidden>
    <h2>Pilot candidates</h2>
    <div id="starredList"></div>
    <div class="row"><button id="exportCsv">Export list as CSV</button></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.min.js"></script>
<!-- Optional. If fetch_museums.py has been run, museums.js sits beside this file and loads instantly. -->
<script src="museums.js" onerror="void 0"></script>
<script>
(function () {
  // Basemaps. Esri World Imagery needs no key. To use Google satellite instead,
  // add the Google Maps JavaScript API with your key and a Leaflet Google layer plugin,
  // and register it where "satellite" is defined below.
  const satellite = L.layerGroup([
    L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", {
      maxZoom: 19, attribution: "Imagery: Esri, Maxar, Earthstar Geographics"
    }),
    L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}", {
      maxZoom: 19, attribution: "Labels: Esri", opacity: 0.85
    })
  ]);
  const streets = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19, attribution: "Map data: OpenStreetMap contributors"
  });

  const map = L.map("map", { worldCopyJump: true, zoomControl: false, layers: [satellite] })
    .setView([30, 10], 2.4);
  L.control.zoom({ position: "bottomright" }).addTo(map);
  L.control.attribution({ position: "bottomleft", prefix: false })
    .addAttribution("Museum data: Wikidata, CC0").addTo(map);

  const satBtn = document.getElementById("sat"), streetBtn = document.getElementById("street");
  satBtn.onclick = () => { map.removeLayer(streets); satellite.addTo(map); satBtn.classList.add("on"); streetBtn.classList.remove("on"); };
  streetBtn.onclick = () => { map.removeLayer(satellite); streets.addTo(map); streetBtn.classList.add("on"); satBtn.classList.remove("on"); };

  // Data model: each museum is [id, name, lat, lon, country, website]
  let museums = [];
  const byId = new Map();
  const cluster = L.markerClusterGroup({
    chunkedLoading: true, chunkInterval: 60, chunkDelay: 20,
    maxClusterRadius: 60, spiderfyOnMaxZoom: true, disableClusteringAtZoom: 15,
    showCoverageOnHover: false
  });
  map.addLayer(cluster);

  let starred = new Set();
  try { starred = new Set(JSON.parse(localStorage.getItem("mm_starred") || "[]")); } catch (e) {}
  function saveStarred() { try { localStorage.setItem("mm_starred", JSON.stringify([...starred])); } catch (e) {} }

  function pinStyle(id) {
    const on = starred.has(id);
    return { radius: on ? 6 : 4, color: on ? "#F5E6C8" : "#7FB0DC", weight: 1.5,
             fillColor: on ? "#F5E6C8" : "#DCEBF7", fillOpacity: 0.9 };
  }
  const markers = new Map();
  function popupHtml(m) {
    const [id, name, lat, lon, country, site] = m;
    const on = starred.has(id);
    return `<b>${esc(name)}</b><br><span style="color:#B9B6AD">${esc(country || "")}</span>` +
      (site ? `<br><a href="${esc(site)}" target="_blank" rel="noopener">Website</a>` : "") +
      `<br><a href="https://www.wikidata.org/wiki/${id}" target="_blank" rel="noopener">Wikidata</a>` +
      `<br><button data-star="${id}" class="${on ? "on" : ""}">${on ? "Pilot candidate" : "Tag as pilot candidate"}</button>`;
  }
  function addMuseums(list) {
    const layers = [];
    for (const m of list) {
      if (byId.has(m[0])) continue;
      byId.set(m[0], m);
      museums.push(m);
      const mk = L.circleMarker([m[2], m[3]], pinStyle(m[0]));
      mk.bindPopup(() => popupHtml(m), { maxWidth: 260 });
      markers.set(m[0], mk);
      layers.push(mk);
    }
    cluster.addLayers(layers);
    document.getElementById("count").textContent = museums.length.toLocaleString();
    document.getElementById("countLabel").textContent = "museums on the map so far.";
    renderStarred();
  }
  map.on("popupopen", (e) => {
    const btn = e.popup.getElement().querySelector("button[data-star]");
    if (!btn) return;
    btn.onclick = () => {
      const id = btn.dataset.star;
      starred.has(id) ? starred.delete(id) : starred.add(id);
      saveStarred();
      markers.get(id).setStyle(pinStyle(id));
      e.popup.setContent(popupHtml(byId.get(id)));
      renderStarred();
    };
  });
  function renderStarred() {
    const box = document.getElementById("starredBox"), list = document.getElementById("starredList");
    const items = [...starred].map((id) => byId.get(id)).filter(Boolean);
    box.hidden = items.length === 0;
    list.innerHTML = items.map((m) => `<div data-go="${m[0]}">${esc(m[1])} <span style="color:#B9B6AD">${esc(m[4] || "")}</span></div>`).join("");
    list.querySelectorAll("[data-go]").forEach((el) => el.onclick = () => flyTo(el.dataset.go));
  }
  document.getElementById("exportCsv").onclick = () => {
    const rows = [["name", "country", "website", "wikidata"]];
    for (const id of starred) { const m = byId.get(id); if (m) rows.push([m[1], m[4] || "", m[5] || "", "https://www.wikidata.org/wiki/" + id]); }
    const csv = rows.map((r) => r.map((v) => '"' + String(v).replace(/"/g, '""') + '"').join(",")).join("\n");
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
    a.download = "pilot_candidates.csv"; a.click();
  };

  function flyTo(id) {
    const m = byId.get(id); if (!m) return;
    map.flyTo([m[2], m[3]], 16, { duration: 1.4 });
    map.once("moveend", () => { const mk = markers.get(id); if (mk) cluster.zoomToShowLayer(mk, () => mk.openPopup()); });
  }

  // Search
  const q = document.getElementById("q"), results = document.getElementById("results");
  q.addEventListener("input", () => {
    const s = q.value.trim().toLowerCase();
    results.innerHTML = "";
    if (s.length < 2) return;
    const hits = [];
    for (const m of museums) {
      if ((m[1] && m[1].toLowerCase().includes(s)) || (m[4] && m[4].toLowerCase().includes(s))) { hits.push(m); if (hits.length >= 40) break; }
    }
    results.innerHTML = hits.map((m) => `<div data-go="${m[0]}">${esc(m[1])} <span>${esc(m[4] || "")}</span></div>`).join("") ||
      `<div><span>No matches loaded yet.</span></div>`;
    results.querySelectorAll("[data-go]").forEach((el) => el.onclick = () => flyTo(el.dataset.go));
  });

  // Live loader: one Wikidata query per country keeps each request small enough to finish.
  const ENDPOINT = "https://query.wikidata.org/sparql?format=json&query=";
  const FALLBACK_CLASSES = ["Q33506","Q207694","Q2772772","Q1970365","Q588140","Q1595639","Q3329412","Q756102","Q2087181"];
  async function sparql(query) {
    const r = await fetch(ENDPOINT + encodeURIComponent(query), { headers: { Accept: "application/sparql-results+json" } });
    if (!r.ok) throw new Error("HTTP " + r.status);
    return (await r.json()).results.bindings;
  }
  function countryQuery(qid, fallback) {
    const typeClause = fallback
      ? `VALUES ?cls { ${FALLBACK_CLASSES.map((c) => "wd:" + c).join(" ")} } ?item wdt:P31 ?cls .`
      : `?item wdt:P31/wdt:P279* wd:Q33506 .`;
    return `SELECT ?item ?itemLabel ?coord ?website WHERE {
      ?item wdt:P17 wd:${qid} ; wdt:P625 ?coord .
      ${typeClause}
      OPTIONAL { ?item wdt:P856 ?website . }
      SERVICE wikibase:label { bd:serviceParam wikibase:language "en,fr,de,es,it,pt,nl,sv,da,no,fi,ja,zh,ru,pl,is". }
    }`;
  }
  function parse(bindings, country) {
    const out = [];
    for (const b of bindings) {
      const m = /Point\(([-\d.eE]+) ([-\d.eE]+)\)/.exec(b.coord.value);
      if (!m) continue;
      const id = b.item.value.split("/").pop();
      const name = b.itemLabel ? b.itemLabel.value : id;
      if (/^Q\d+$/.test(name)) continue;
      out.push([id, name, +m[2], +m[1], country, b.website ? b.website.value : ""]);
    }
    return out;
  }
  const status = document.getElementById("status"), bar = document.getElementById("barFill");
  document.getElementById("load").onclick = async function () {
    this.disabled = true;
    status.textContent = "Fetching the list of countries.";
    let countries;
    try {
      countries = await sparql(`SELECT ?c ?cLabel WHERE { ?c wdt:P31 wd:Q6256 . MINUS { ?c wdt:P576 ?d } SERVICE wikibase:label { bd:serviceParam wikibase:language "en". } }`);
    } catch (e) { status.textContent = "Wikidata did not answer. Check the connection and try again."; this.disabled = false; return; }
    const total = countries.length;
    let done = 0, failed = [];
    for (const c of countries) {
      const qid = c.c.value.split("/").pop(), name = c.cLabel.value;
      status.textContent = `Loading ${name} (${done + 1} of ${total})`;
      let rows = null;
      try { rows = await sparql(countryQuery(qid, false)); }
      catch (e) { try { rows = await sparql(countryQuery(qid, true)); } catch (e2) { failed.push(name); } }
      if (rows) addMuseums(parse(rows, name));
      done++; bar.style.width = (100 * done / total) + "%";
    }
    status.textContent = `Done. ${museums.length.toLocaleString()} museums with coordinates in Wikidata.` +
      (failed.length ? ` Timed out for: ${failed.join(", ")}.` : "");
    this.textContent = "Loaded";
  };

  if (window.MUSEUMS && Array.isArray(window.MUSEUMS)) {
    addMuseums(window.MUSEUMS);
    status.textContent = "Loaded from museums.js.";
    document.getElementById("load").textContent = "Reload from Wikidata";
  }
  function esc(s) { return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
})();
</script>
</body>
</html>
